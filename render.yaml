# Render Blueprint for AgriTwin.
#
# Deploy from GitHub: New > Blueprint > select this repository and branch main.
# Keep the service names below, or update CORS_ORIGINS / BACKEND_ORIGIN to match
# the names you choose.
#
# The ML artifacts are about 1 GB and PyTorch needs more memory than Render's
# free tier, so both web services use the Starter plan. Do not put a real API
# key in this file: DATA_GOV_API_KEY is filled in the Render dashboard.

databases:
  - name: agritwin-db
    databaseName: agritwin
    user: agritwin

services:
  - type: web
    name: agritwin-backend
    runtime: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/system/health
    disk:
      name: agritwin-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agritwin-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Keep DEMO_MODE=true for the sample farms and demo login. Set false only
      # after creating real users through /api/v1/auth/register.
      - key: DEMO_MODE
        value: "true"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://agritwin-frontend.onrender.com,https://agritwin-backend.onrender.com
      - key: SEED_DEMO_USER_EMAIL
        value: demo@agritwin.in
      - key: SEED_DEMO_USER_PASSWORD
        value: Demo@12345
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: ROUTING_PROVIDER
        value: osrm
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: LIVE_MARKET_PROVIDER
        value: auto
      # Optional. Leave unset to use the keyless five-state mirror.
      - key: DATA_GOV_API_KEY
        sync: false
      - key: LIVE_MARKET_USE_VARIETY_SOURCE
        value: "true"

  - type: web
    name: agritwin-frontend
    runtime: docker
    rootDir: ./frontend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      # No trailing slash. The nginx template proxies /api and /uploads here.
      - key: BACKEND_ORIGIN
        value: https://agritwin-backend.onrender.com
