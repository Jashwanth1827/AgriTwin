name: agritwin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agritwin}
      POSTGRES_USER: ${POSTGRES_USER:-agritwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agritwin_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agritwin} -d ${POSTGRES_DB:-agritwin}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agritwin}:${POSTGRES_PASSWORD:-agritwin_dev_password}@db:5432/${POSTGRES_DB:-agritwin}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEMO_USER_EMAIL: ${SEED_DEMO_USER_EMAIL:-demo@agritwin.in}
      SEED_DEMO_USER_PASSWORD: ${SEED_DEMO_USER_PASSWORD:-Demo@12345}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      LIVE_MARKET_PROVIDER: ${LIVE_MARKET_PROVIDER:-auto}
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
      DATA_GOV_RESOURCE_ID: ${DATA_GOV_RESOURCE_ID:-9ef84268-d588-465a-a308-a864a43d0070}
      DATA_GOV_VARIETY_RESOURCE_ID: ${DATA_GOV_VARIETY_RESOURCE_ID:-35985678-0d79-46b4-9ed6-6f13308a1d24}
      LIVE_MARKET_USE_VARIETY_SOURCE: ${LIVE_MARKET_USE_VARIETY_SOURCE:-true}
      DATA_GOV_PAGE_SIZE: ${DATA_GOV_PAGE_SIZE:-200}
      LIVE_MARKET_TIMEOUT_SECONDS: ${LIVE_MARKET_TIMEOUT_SECONDS:-30}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      # Use the IPv4 literal: busybox wget resolves "localhost" to ::1 first,
      # but nginx listens on 0.0.0.0:80.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads:
